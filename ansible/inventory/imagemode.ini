[ipa_primary]
primary ansible_host=CHANGEME_PRIMARY_IP ansible_fqdn=primary.imagemode.test

[ipa_replicas]
replica1 ansible_host=CHANGEME_REPLICA1_IP ansible_fqdn=replica1.imagemode.test
replica2 ansible_host=CHANGEME_REPLICA2_IP ansible_fqdn=replica2.imagemode.test
replica3 ansible_host=CHANGEME_REPLICA3_IP ansible_fqdn=replica3.imagemode.test

[ipa_canary]
replica3

[all:vars]
ansible_user=root
ansible_ssh_private_key_file=~/.ssh/idm_ci_key
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
ipadomain=imagemode.test
iparealm=IMAGEMODE.TEST
ipaadmin_password=Secret123
ipadm_password=Secret123
