---
- name: Create backup directory
  file:
    path: "{{ backup_base_dir }}/{{ backup_label }}"
    state: directory
    mode: "0700"

- name: Backup sysupgrade state
  copy:
    src: /var/lib/ipa/sysupgrade/sysupgrade.state
    dest: "{{ backup_base_dir }}/{{ backup_label }}/sysupgrade.state"
    remote_src: true
  ignore_errors: true

- name: Export schema snapshot
  shell: |
    ldapsearch -Y EXTERNAL -H ldapi:// -b "cn=schema" -s base \
      objectClasses attributeTypes \
      > "{{ backup_base_dir }}/{{ backup_label }}/schema.ldif" 2>/dev/null
  changed_when: true
  ignore_errors: true

- name: Export replication agreements
  shell: |
    ldapsearch -x -H ldap://localhost -D "cn=Directory Manager" \
      -w "{{ backup_dm_password }}" -b "cn=config" \
      "(objectClass=nsds5replicationagreement)" \
      nsds5replicahost nsds5replicaport \
      > "{{ backup_base_dir }}/{{ backup_label }}/repl-agreements.ldif" 2>/dev/null
  changed_when: true
  no_log: true
  ignore_errors: true

- name: Backup IPA topology
  shell: |
    ipa topologysegment-find domain > "{{ backup_base_dir }}/{{ backup_label }}/topo-domain.txt" 2>/dev/null || true
    ipa topologysegment-find ca > "{{ backup_base_dir }}/{{ backup_label }}/topo-ca.txt" 2>/dev/null || true
  changed_when: true
  ignore_errors: true

- name: Backup critical config files
  copy:
    src: "{{ item }}"
    dest: "{{ backup_base_dir }}/{{ backup_label }}/"
    remote_src: true
  loop:
    - /etc/ipa/default.conf
  ignore_errors: true

- name: Backup dse.ldif
  shell: |
    cp /etc/dirsrv/slapd-*/dse.ldif "{{ backup_base_dir }}/{{ backup_label }}/" 2>/dev/null || true
  changed_when: true
  ignore_errors: true

- name: Record FreeIPA version
  shell: rpm -q freeipa-server > "{{ backup_base_dir }}/{{ backup_label }}/freeipa-version.txt"
  changed_when: true

- name: Record bootc status
  shell: bootc status > "{{ backup_base_dir }}/{{ backup_label }}/bootc-status.txt" 2>/dev/null || true
  changed_when: true

- name: Snapshot LMDB database
  shell: |
    cp -a /var/lib/dirsrv/slapd-*/db/ "{{ backup_base_dir }}/{{ backup_label }}/db-snapshot/"
  when: include_lmdb | bool
  changed_when: true
